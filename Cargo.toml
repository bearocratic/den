[package]
name = "den"
version = "0.2.1"
edition = "2021"
description = "TUI watcher for git repos in a base folder — shows dirty state at a glance"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
git2 = { version = "0.20", default-features = false }
notify = "6"
notify-debouncer-mini = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.30"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
