[workspace]
members = ["crates/den-core", "apps/bar/src-tauri"]

[package]
name = "den"
version = "0.9.1"
edition = "2021"
license = "Apache-2.0"
description = "TUI watcher for git repos in a base folder — shows dirty state at a glance"

[dependencies]
anyhow = "1"
den-core = { path = "crates/den-core" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
notify = "6"
notify-debouncer-mini = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
