name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  TAP_REPO: bearocratic/homebrew-tap
  FORMULA_NAME: den

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      notes_path: ${{ steps.notes.outputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and author
        id: v
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG_NAME (expected vX.Y.Z)"
            exit 1
          fi
          if [[ "${{ github.actor }}" != "${{ secrets.RELEASE_AUTHOR }}" ]]; then
            echo "::error::Only @${{ secrets.RELEASE_AUTHOR }} can create release tags (actor: ${{ github.actor }})"
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release notes exist
        id: notes
        run: |
          set -euo pipefail
          NOTES="releases/${{ steps.v.outputs.tag }}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::Missing release notes: $NOTES"
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          set -euo pipefail
          CARGO_VERSION=$(awk -F\" '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          EXPECTED="${{ steps.v.outputs.version }}"
          if [[ "$CARGO_VERSION" != "$EXPECTED" ]]; then
            echo "::error::Cargo.toml version $CARGO_VERSION does not match tag (expected $EXPECTED)"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: darwin-arm64
            cross: false
          - target: x86_64-apple-darwin
            os: macos-14
            asset: darwin-amd64
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: linux-amd64
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: linux-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [[ "$USE_CROSS" == "true" ]]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
          OUTDIR="dist/den-${TAG}-${ASSET}"
          mkdir -p "$OUTDIR"
          cp "target/${TARGET}/release/den" "$OUTDIR/"
          cp LICENSE "$OUTDIR/"
          cp README.md "$OUTDIR/"
          tar -C dist -czf "${OUTDIR}.tar.gz" "$(basename "$OUTDIR")"
          rm -rf "$OUTDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: den-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-stage

      - name: Collect tarballs
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-stage -name '*.tar.gz' -exec mv {} dist/ \;
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          NOTES: ${{ needs.validate.outputs.notes_path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --latest \
            dist/*.tar.gz dist/SHA256SUMS.txt

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          sha() { sha256sum "dist/$1" | awk '{print $1}'; }
          SHA_DARWIN_ARM64="$(sha "den-${TAG}-darwin-arm64.tar.gz")"
          SHA_DARWIN_AMD64="$(sha "den-${TAG}-darwin-amd64.tar.gz")"
          SHA_LINUX_AMD64="$(sha "den-${TAG}-linux-amd64.tar.gz")"
          SHA_LINUX_ARM64="$(sha "den-${TAG}-linux-arm64.tar.gz")"

          workdir="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "$workdir/tap"
          mkdir -p "$workdir/tap/Formula"

          cat > "$workdir/tap/Formula/${FORMULA_NAME}.rb" <<EOF
          class Den < Formula
            desc "Terminal watcher for git repos — dirty-state tiles at a glance"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "Proprietary"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/${TAG}/den-${TAG}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/${TAG}/den-${TAG}-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/${REPO}/releases/download/${TAG}/den-${TAG}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              on_arm do
                url "https://github.com/${REPO}/releases/download/${TAG}/den-${TAG}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "den"
            end

            test do
              assert_match "den", shell_output("#{bin}/den --version")
            end
          end
          EOF

          cd "$workdir/tap"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA_NAME}.rb"
          if git diff --cached --quiet; then
            echo "No changes to formula."
          else
            git commit -m "den ${TAG}"
            git push
          fi
